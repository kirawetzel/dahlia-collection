<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kira's 2026 Dahlia Collection</title>
<style>
:root{
  --bg:#1c2e1c;--surface:#f6f2ec;--surface2:#e8dfd3;
  --pink:#c2567a;--green:#5a8c4a;--text:#2b1e1e;--muted:#7a6060;
  --shadow:0 4px 18px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--bg);min-height:100vh;font-size:18px} /* Bumped overall text size */
header{padding:2.2rem 2rem 1.6rem;text-align:center;border-bottom:3px solid var(--pink)}
header h1{color:#f0ebe4;font-size:2.8rem;font-weight:normal;letter-spacing:.05em} /* Increased 2pt */
header p{color:#9abf9a;font-style:italic;margin-top:.35rem;font-size:1.2rem} /* Increased 2pt */

/* Page layout split for left-hand filters */
.container-layout {
  display: flex;
  flex-direction: row;
  min-height: 80vh;
  background: var(--surface);
}

/* Sidebar Controls on the Left */
#controls{
  background: var(--surface);
  width: 320px;
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  border-right: 2px solid var(--surface2);
  flex-shrink: 0;
}
.search{position:relative;width:100%}
.search input{width:100%;padding:.6rem 1rem .6rem 2.2rem;border:2px solid var(--surface2);
  border-radius:25px;font-size:1.02rem;font-family:inherit;outline:none;transition:border .2s} /* Increased 2pt */
.search input:focus{border-color:var(--green)}
.search::before{content:'🔍';position:absolute;left:.7rem;top:50%;transform:translateY(-50%);font-size:.9rem}
.fg{display:flex;flex-direction:column;gap:.4rem;align-items:flex-start;width:100%}
.fg-pills {display:flex;flex-wrap:wrap;gap:.4rem}
.flbl{font-size:.85rem;color:var(--muted);font-family:sans-serif;text-transform:uppercase;letter-spacing:.05em;font-weight:bold} /* Increased 2pt */
.pill{padding:.35rem .8rem;border-radius:20px;border:2px solid var(--surface2);background:#fff;
  font-size:.9rem;cursor:pointer;transition:all .15s;font-family:sans-serif;color:var(--text)} /* Increased 2pt */
.pill:hover{border-color:var(--green)}
.pill.on{background:var(--green);color:#fff;border-color:var(--green)}
.pill.fon{background:var(--pink);color:#fff;border-color:var(--pink)}
select#srt{width:100%;padding:.5rem .65rem;border:2px solid var(--surface2);border-radius:8px;
  font-size:.92rem;font-family:inherit;background:#fff;cursor:pointer;outline:none} /* Increased 2pt */

/* Main Content Panel on the Right */
#main{padding:2rem;flex:1}
#count{font-family:sans-serif;font-size:1rem;color:var(--muted);margin-bottom:1.1rem} /* Increased 2pt */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.5rem}

/* Card Visuals */
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(0,0,0,.14)}
.cph{width:100%;height:210px;display:flex;align-items:center;justify-content:center;font-size:4rem;flex-shrink:0}
.cimg{width:100%;height:210px;object-fit:cover;display:block;flex-shrink:0}
.cbody{padding:1.1rem;flex:1;display:flex;flex-direction:column;gap:.5rem}
.cname{font-size:1.2rem;font-weight:bold;font-style:italic;color:var(--text);line-height:1.3} /* Increased 2pt */
.ctags{display:flex;flex-wrap:wrap;gap:.35rem}
.tag{padding:.2rem .6rem;border-radius:12px;font-size:.8rem;font-family:sans-serif} /* Increased 2pt */
.tl{background:#e8eef8;color:#2a3e6e}
.ty{background:#fff3e0;color:#7a4a00}
.tid{background:#f0e6ff;color:#4b0082;font-weight:bold}
.cobs{font-size:.9rem;color:var(--muted);font-style:italic;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} /* Increased 2pt */
.fbtn{position:absolute;top:.55rem;right:.55rem;background:rgba(255,255,255,.92);border:none;
  border-radius:50%;width:34px;height:34px;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.14);z-index:2;transition:transform .15s}

/* Status Badges */
.planted{background:#e6f4e6;color:#1a5c1a}
.died{background:#fce8e8;color:#8c1a1a}
.culled{background:#fdf3e6;color:#7a4a00}
.cutting{background:#e8f0fc;color:#1a3a7a}
.tuber{background:#f3eafc;color:#4a1a7a}

/* Modal Overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
.mph{width:100%;height:160px;display:flex;align-items:center;justify-content:center;
  font-size:4.5rem;border-radius:16px 16px 0 0;background:linear-gradient(135deg,#e8ddd0,#d4c4b0)}
.mimg{width:100%;max-height:300px;object-fit:cover;border-radius:16px 16px 0 0;display:block}
.mbody{padding:1.5rem 2rem 2rem}
.mname{font-size:1.8rem;font-style:italic;margin-bottom:.7rem;line-height:1.3} /* Increased 2pt */
.mtags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.mtag{padding:.3rem .8rem;border-radius:20px;font-size:.9rem;font-family:sans-serif} /* Increased 2pt */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;background:var(--surface);
  border-radius:10px;padding:1.1rem;margin-bottom:1rem;font-family:sans-serif}
.ml{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em} /* Increased 2pt */
.mv{font-weight:bold;font-size:1rem;margin-top:.1rem} /* Increased 2pt */
.mobs{font-size:1.02rem;line-height:1.75;color:var(--muted);font-style:italic;white-space:pre-line} /* Increased 2pt */
.mclose{position:absolute;top:.7rem;right:.7rem;background:rgba(255,255,255,.92);border:none;
  border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.msect{font-family:sans-serif;font-size:.88rem;font-weight:bold;color:var(--muted);
  text-transform:uppercase;letter-spacing:#06em;margin:1.2rem 0 .5rem;border-top:1px solid var(--surface2);padding-top:1rem} /* Increased 2pt */

/* Dynamic Load Animations */
#loading{text-align:center;padding:5rem 2rem;font-family:sans-serif;color:var(--muted);width:100%}
.spin{width:42px;height:42px;border:3px solid var(--surface2);border-top-color:var(--green);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1.2rem}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{grid-column:1/-1;text-align:center;padding:4rem 2rem;font-family:sans-serif;color:var(--muted)}

@media(max-width:820px){
  .container-layout {flex-direction: column;}
  #controls {width: 100%; border-right: none; border-bottom: 2px solid var(--surface2); padding: 1.2rem}
}
</style>
</head>
<body>

<header>
  <h1>Kira's 2026 Dahlia Collection</h1>
  <p>Browse, search, and discover</p>
</header>

<div class="container-layout">
  <!-- Left Side Controller Bar -->
  <div id="controls">
    <div class="search"><input id="search" type="text" placeholder="Search by name or notes…" oninput="applyFilters()"></div>
    <div class="fg" id="status-fg"></div>
    <div class="fg" id="form-fg"></div>
    <div class="fg">
      <span class="flbl">Sort Sequence</span>
      <select id="srt" onchange="applyFilters()">
        <option value="name">Sort: Name A–Z</option>
        <option value="nz">Name Z–A</option>
        <option value="ha">Height ↑</option>
        <option value="hd">Height ↓</option>
      </select>
    </div>
    <button class="pill" id="favbtn" onclick="toggleFavFilter()" style="width:100%; text-align:center; margin-top:0.5rem;">❤️ Favorites Only</button>
  </div>

  <!-- Right Side Content Output -->
  <div id="main">
    <div id="loading"><div class="spin"></div><p>Syncing data from live collection repository…</p></div>
    <div id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
let all=[],favs=new Set(),aSt=new Set(),aForm=new Set(),favOnly=false,scriptUrl='https://script.google.com/macros/s/AKfycbzPyvyJZRKNBf3017gse-cNz2wBfSDRQbGMGd-lHHm0TmSMPvQjshigcY0q1s0RccFS/exec';

// Field getters matching specific object payloads
const gv=(d,k)=>String(d[k]??'').trim();
const name=d=>gv(d,'Variety');
const idNum=d=>gv(d,'Id2026');
const height=d=>gv(d,'EstHeight');
const formType=d=>gv(d,'Form');
const status=d=>gv(d,'CurrentYearStatus');
const obs=d=>gv(d,'Notes2026');
const photo=d=>{const p=d['PhotoUrl'];return(typeof p==='string'&&p.startsWith('http'))?p:'';}
const yr26=d=>gv(d,'Year2026');
const confirmed=d=>gv(d,'Confirmed');

function statusClass(s){
  const sl=s.toLowerCase();
  if(sl.includes('culled')||sl.includes('virus'))return 'culled';
  if(sl.includes('died')||sl.includes('dead'))return 'died';
  if(sl.includes('planted')||sl.includes('sprout'))return 'planted';
  if(sl.includes('cutting'))return 'cutting';
  if(sl.includes('tuber'))return 'tuber';
  return '';
}

function statusLabel(s){
  const sl=s.toLowerCase();
  if(sl.includes('culled')||sl.includes('virus'))return '🚫 Culled';
  if(sl.includes('died'))return '💀 Died';
  if(sl.includes('planted')||sl.includes('sprout'))return '🌱 Active';
  if(sl.includes('cutting'))return '✂️ Cutting';
  if(sl.includes('tuber'))return '🥔 Tuber';
  return s;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(s){const m=String(s||'').match(/(\d+\.?\d*)/);return m?parseFloat(m[1]):0}

function load(){
  document.getElementById('loading').style.display='block';
  document.getElementById('grid').innerHTML='';

  const cb='_dl_'+Date.now();
  let s=null;
  const done=()=>{if(s?.parentNode)s.parentNode.removeChild(s);delete window[cb];};
  const t=setTimeout(()=>{done();showErr('Connection pipeline timed out.');},12000);

  window[cb]=d=>{
    clearTimeout(t);done();
    if(!Array.isArray(d)){showErr('Invalid server data format returned.');return;}
    all=d.filter(r=>name(r));
    buildFilters();applyFilters();
    document.getElementById('loading').style.display='none';
  };

  s=document.createElement('script');
  s.src=scriptUrl+(scriptUrl.includes('?')?'&':'?')+'callback='+cb;
  s.onerror=()=>{clearTimeout(t);done();showErr('Could not open endpoint bridge connection.');};
  document.head.appendChild(s);
}

function showErr(msg){
  document.getElementById('loading').innerHTML=`<div style="font-size:2.5rem;margin-bottom:.8rem">⚠️</div>
    <p><strong>Cloud sync interrupted.</strong></p>
    <p style="margin:.5rem auto;max-width:420px;font-size:.9rem;opacity:.8">${esc(msg)}</p>
    <button onclick="load()" style="margin-top:1rem;padding:.5rem 1.4rem;background:#1c2e1c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.95rem">Retry Handshake</button>`;
}

function uniq(arr){return[...new Set(arr.filter(Boolean))].sort();}

function buildFilters(){
  const statuses=uniq(all.map(d=>{
    const s=status(d).toLowerCase();
    if(s.includes('culled')||s.includes('virus'))return 'Culled';
    if(s.includes('died'))return 'Died';
    if(s.includes('planted')||s.includes('sprout'))return 'Active';
    if(s.includes('cutting'))return 'Cutting';
    if(s.includes('tuber'))return 'Tuber';
    return null;
  }));
  const forms=uniq(all.map(d=>formType(d)));

  mkPills('status-fg','Filter Status:',statuses,aSt,d=>{
    const s=status(d).toLowerCase();
    if(s.includes('culled')||s.includes('virus'))return 'Culled';
    if(s.includes('died'))return 'Died';
    if(s.includes('planted')||s.includes('sprout'))return 'Active';
    if(s.includes('cutting'))return 'Cutting';
    if(s.includes('tuber'))return 'Tuber';
    return '';
  });
  mkPills('form-fg','Filter Form:',forms,aForm,d=>formType(d));
}

function mkPills(id,lbl,vals,set,getFn){
  const el=document.getElementById(id);
  if(!vals.length){el.innerHTML='';return;}
  el.innerHTML=`<span class="flbl">${lbl}</span><div class="fg-pills"></div>`;
  const pContainer = el.querySelector('.fg-pills');
  vals.forEach(v=>{
    const b=document.createElement('button');
    b.className='pill';b.textContent=v;
    b.onclick=()=>{set.has(v)?(set.delete(v),b.classList.remove('on')):(set.add(v),b.classList.add('on'));applyFilters();};
    pContainer.appendChild(b);
  });
}

function toggleFavFilter(){favOnly=!favOnly;document.getElementById('favbtn').classList.toggle('fon',favOnly);applyFilters();}

function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const srt=document.getElementById('srt').value;

  let res=all.filter(d=>{
    const n=name(d).toLowerCase();
    const s=status(d).toLowerCase();
    let stCat='';
    if(s.includes('culled')||s.includes('virus'))stCat='Culled';
    else if(s.includes('died'))stCat='Died';
    else if(s.includes('planted')||s.includes('sprout'))stCat='Active';
    else if(s.includes('cutting'))stCat='Cutting';
    else if(s.includes('tuber'))stCat='Tuber';

    if(q&&!n.includes(q)&&!obs(d).toLowerCase().includes(q)&&!idNum(d).toLowerCase().includes(q))return false;
    if(aSt.size&&!aSt.has(stCat))return false;
    if(aForm.size&&!aForm.has(formType(d)))return false;
    if(favOnly&&!favs.has(name(d)))return false;
    return true;
  });

  res=[...res].sort((a,b)=>{
    if(srt==='name')return name(a).localeCompare(name(b));
    if(srt==='nz')return name(b).localeCompare(name(a));
    if(srt==='ha')return num(height(a))-num(height(b));
    if(srt==='hd')return num(height(b))-num(height(a));
    return 0;
  });

  render(res);
  document.getElementById('count').textContent=`Displaying ${res.length} of ${all.length} registered varieties`;
}

function cardBg(n){
  let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;
  return `hsl(${h},35%,88%)`;
}

function render(list){
  const g=document.getElementById('grid');
  if(!list.length){
    g.innerHTML='<div class="empty"><div style="font-size:2.5rem;margin-bottom:.8rem">🌿</div><p>No active cultivars map to your current configuration.</p></div>';
    return;
  }
  g.innerHTML=list.map(d=>{
    const oi=all.indexOf(d),n=name(d),id=idNum(d),st=status(d),h=height(d),f=formType(d),o=obs(d),img=photo(d),fv=favs.has(n);
    const sc=statusClass(st),bg=cardBg(n);
    const imgHtml=img?`<img class="cimg" src="${esc(img)}" alt="${esc(n)}" loading="lazy" onerror="this.style.display='none';this.previousSibling.style.display='flex'">`:'';
    return `<div class="card" onclick="openModal(${oi})">
      <button class="fbtn" onclick="event.stopPropagation();toggleFav(${oi},this)">${fv?'❤️':'🤍'}</button>
      <div class="cph" style="background:${bg};${img?'display:none':''}">🌸</div>
      ${imgHtml}
      <div class="cbody">
        <div class="cname">${esc(n)}</div>
        <div class="ctags">
          ${id?`<span class="tag tid">#${esc(id)}</span>`:''}
          ${sc?`<span class="tag ${sc}">${esc(statusLabel(st))}</span>`:''}
          ${f?`<span class="tag tl">${esc(f)}</span>`:''}
          ${h?`<span class="tag ty">📏 ${esc(h)}</span>`:''}
        </div>
        ${o?`<div class="cobs">${esc(o)}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function toggleFav(i,btn){
  const n=name(all[i]);
  favs.has(n)?(favs.delete(n),btn.textContent='🤍'):(favs.add(n),btn.textContent='❤️');
  if(favOnly)applyFilters();
}

function openModal(i){
  const d=all[i];if(!d)return;
  const n=name(d),id=idNum(d),st=status(d),h=height(d),f=formType(d),o=obs(d),img=photo(d),conf=confirmed(d),sc=statusClass(st),bg=cardBg(n);

  const rows=[
    [id&&'2026 ID #',id],
    [f&&'Form / Classification',f],
    [h&&'Estimated Height',`📏 ${h}`],
    [conf&&'Confirmed Extraction',conf]
  ].filter(r=>r[0]);

  document.getElementById('modal').innerHTML=`
    <button class="mclose" onclick="closeModal()">✕</button>
    ${img?`<img class="mimg" src="${esc(img)}" alt="${esc(n)}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:``}
    <div class="mph" style="${img?'display:none;':''}background:${bg}">🌸</div>
    <div class="mbody">
      <div class="mname">${esc(n)}</div>
      <div class="mtags">
        ${sc?`<span class="mtag ${sc}">${esc(statusLabel(st))}</span>`:''}
      </div>
      ${rows.length?`<div class="mgrid">${rows.map(([k,v])=>`<div><div class="ml">${esc(k)}</div><div class="mv">${esc(v)}</div></div>`).join('')}</div>`:''}
      ${o?`<div class="msect">2026 Notes & Field Observations</div><div class="mobs">${esc(o)}</div>`:''}
    </div>`;

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// AUTO-RUN EVENT INTERCEPTOR: Fires off immediate data request on system load loop
window.addEventListener("DOMContentLoaded", load);
</script>
</body>
</html>
