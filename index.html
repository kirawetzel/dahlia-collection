<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dahlia Collection</title>
<style>
:root{
  --bg:#1c2e1c;--surface:#f6f2ec;--surface2:#e8dfd3;
  --pink:#c2567a;--green:#5a8c4a;--text:#2b1e1e;--muted:#7a6060;
  --shadow:0 4px 18px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:var(--bg);min-height:100vh}
header{padding:2.2rem 2rem 1.6rem;text-align:center;border-bottom:3px solid var(--pink)}
header h1{color:#f0ebe4;font-size:2.6rem;font-weight:normal;letter-spacing:.05em}
header p{color:#9abf9a;font-style:italic;margin-top:.35rem}

/* Setup */
#setup{background:#fffdf5;border:2px solid #e8c840;border-radius:10px;padding:1.2rem 1.5rem;
  margin:1.5rem auto;max-width:680px;font-family:sans-serif;font-size:.9rem}
#setup h3{margin-bottom:.4rem;color:#5a4a00}
#setup input{width:100%;padding:.5rem .8rem;border:1px solid #ccc;border-radius:6px;
  margin:.5rem 0;font-size:.9rem}
#setup button{padding:.4rem 1.1rem;background:var(--bg);color:#fff;border:none;
  border-radius:6px;cursor:pointer;font-size:.9rem}

/* Controls */
#controls{background:var(--surface);padding:1.1rem 1.5rem;display:none;flex-wrap:wrap;
  gap:.7rem;align-items:center;position:sticky;top:0;z-index:10;
  box-shadow:0 2px 12px rgba(0,0,0,.2)}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:.5rem 1rem .5rem 2.2rem;border:2px solid var(--surface2);
  border-radius:25px;font-size:.88rem;font-family:inherit;outline:none;transition:border .2s}
.search input:focus{border-color:var(--green)}
.search::before{content:'🔍';position:absolute;left:.7rem;top:50%;transform:translateY(-50%);font-size:.78rem}
.fg{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.flbl{font-size:.72rem;color:var(--muted);font-family:sans-serif;text-transform:uppercase;letter-spacing:.05em}
.pill{padding:.26rem .7rem;border-radius:20px;border:2px solid var(--surface2);background:#fff;
  font-size:.78rem;cursor:pointer;transition:all .15s;font-family:sans-serif;color:var(--text)}
.pill:hover{border-color:var(--green)}
.pill.on{background:var(--green);color:#fff;border-color:var(--green)}
.pill.fon{background:var(--pink);color:#fff;border-color:var(--pink)}
select#srt{padding:.42rem .65rem;border:2px solid var(--surface2);border-radius:8px;
  font-size:.8rem;font-family:inherit;background:#fff;cursor:pointer;outline:none}

/* Main */
#main{padding:1.5rem 2rem;background:var(--surface);min-height:60vh}
#count{font-family:sans-serif;font-size:.8rem;color:var(--muted);margin-bottom:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.3rem}

/* Card */
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(0,0,0,.14)}
.cph{width:100%;height:190px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;flex-shrink:0}
.cimg{width:100%;height:190px;object-fit:cover;display:block;flex-shrink:0}
.cbody{padding:.9rem 1rem 1.1rem;flex:1;display:flex;flex-direction:column;gap:.4rem}
.cname{font-size:1.05rem;font-weight:bold;font-style:italic;color:var(--text);line-height:1.3}
.ctags{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{padding:.14rem .52rem;border-radius:12px;font-size:.7rem;font-family:sans-serif}
.ts{background:#e6f0e6;color:#2e5e2e}
.tl{background:#e8eef8;color:#2a3e6e}
.ty{background:#fff3e0;color:#7a4a00}
.cmeta{font-family:sans-serif;font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.6rem}
.cobs{font-size:.78rem;color:var(--muted);font-style:italic;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fbtn{position:absolute;top:.55rem;right:.55rem;background:rgba(255,255,255,.92);border:none;
  border-radius:50%;width:32px;height:32px;font-size:.95rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 5px rgba(0,0,0,.14);z-index:2;transition:transform .15s}
.fbtn:hover{transform:scale(1.15)}

/* Status colors */
.planted{background:#e6f4e6;color:#1a5c1a}
.died{background:#fce8e8;color:#8c1a1a}
.culled{background:#fdf3e6;color:#7a4a00}
.cutting{background:#e8f0fc;color:#1a3a7a}
.tuber{background:#f3eafc;color:#4a1a7a}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
.mph{width:100%;height:160px;display:flex;align-items:center;justify-content:center;
  font-size:4.5rem;border-radius:16px 16px 0 0;background:linear-gradient(135deg,#e8ddd0,#d4c4b0)}
.mimg{width:100%;max-height:280px;object-fit:cover;border-radius:16px 16px 0 0;display:block}
.mbody{padding:1.3rem 1.8rem 1.8rem}
.mname{font-size:1.65rem;font-style:italic;margin-bottom:.7rem;line-height:1.3}
.mtags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.mtag{padding:.26rem .72rem;border-radius:20px;font-size:.8rem;font-family:sans-serif}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;background:var(--surface);
  border-radius:10px;padding:.9rem;margin-bottom:1rem;font-family:sans-serif}
.ml{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mv{font-weight:bold;font-size:.88rem;margin-top:.1rem}
.mobs{font-size:.9rem;line-height:1.75;color:var(--muted);font-style:italic;white-space:pre-line}
.mclose{position:absolute;top:.7rem;right:.7rem;background:rgba(255,255,255,.92);border:none;
  border-radius:50%;width:34px;height:34px;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.msect{font-family:sans-serif;font-size:.78rem;font-weight:bold;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .4rem;border-top:1px solid var(--surface2);padding-top:.8rem}

/* Loading/empty */
#loading{text-align:center;padding:3rem;font-family:sans-serif;color:var(--muted);display:none}
.spin{width:36px;height:36px;border:3px solid var(--surface2);border-top-color:var(--green);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{grid-column:1/-1;text-align:center;padding:3rem;font-family:sans-serif;color:var(--muted)}

@media(max-width:560px){
  header h1{font-size:1.9rem}
  #main,#controls{padding:1rem}
  .mbody{padding:1rem 1.2rem 1.5rem}
}
</style>
</head>
<body>

<header>
  <h1>🌸 Dahlia Collection</h1>
  <p>Browse, search, and discover</p>
</header>

<div id="setup">
  <h3>⚙️ Connect Your Google Sheet</h3>
  <p>Paste your Google Apps Script URL. Your sheet stays private.</p>
  <input id="url-input" type="text" placeholder="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec">
  <button onclick="connect()">Load Dahlias</button>
</div>

<div id="controls">
  <div class="search"><input id="search" type="text" placeholder="Search by name…" oninput="applyFilters()"></div>
  <div class="fg" id="status-fg"></div>
  <div class="fg" id="loc-fg"></div>
  <div class="fg" id="yr-fg"></div>
  <select id="srt" onchange="applyFilters()">
    <option value="name">Sort: Name A–Z</option>
    <option value="nz">Name Z–A</option>
    <option value="ha">Height ↑</option>
    <option value="hd">Height ↓</option>
  </select>
  <button class="pill" id="favbtn" onclick="toggleFavFilter()">❤️ Favorites</button>
</div>

<div id="main">
  <div id="loading"><div class="spin"></div><p>Loading your dahlias…</p></div>
  <div id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
let all=[],favs=new Set(),aSt=new Set(),aLoc=new Set(),aYr=new Set(),favOnly=false,scriptUrl='';

// Field getters matching actual sheet columns
const gv=(d,k)=>String(d[k]??'').trim();
const name=d=>gv(d,'Variety');
const height=d=>gv(d,'Height');
const status=d=>gv(d,'Status');
const loc=d=>gv(d,'Home/Plot?');
const obs=d=>gv(d,'Observations');
const photo=d=>{const p=d['Photo'];return(typeof p==='string'&&p.startsWith('http'))?p:'';}
const yr26=d=>gv(d,'2026');
const yr25=d=>gv(d,'2025');
const from=d=>gv(d,'From?');
const future=d=>gv(d,'Future Plantings');
const photoStream=d=>gv(d,'Photo Stream?');

function statusClass(s){
  const sl=s.toLowerCase();
  if(sl.includes('culled')||sl.includes('virus'))return 'culled';
  if(sl.includes('died')||sl.includes('dead'))return 'died';
  if(sl.includes('planted'))return 'planted';
  if(sl.includes('cutting'))return 'cutting';
  if(sl.includes('tuber'))return 'tuber';
  return '';
}

function statusLabel(s){
  const sl=s.toLowerCase();
  if(sl.includes('culled')||sl.includes('virus'))return '🚫 Culled';
  if(sl.includes('died'))return '💀 Died';
  if(sl.includes('planted'))return '🌱 Planted';
  if(sl.includes('cutting'))return '✂️ Cutting';
  if(sl.includes('tuber'))return '🥔 Tuber';
  return s;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(s){const m=String(s||'').match(/(\d+\.?\d*)/);return m?parseFloat(m[1]):0}

function connect(){
  scriptUrl=document.getElementById('url-input').value.trim();
  if(!scriptUrl){alert('Please paste your Apps Script URL.');return;}
  load();
}

function load(){
  document.getElementById('setup').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('controls').style.display='none';
  document.getElementById('grid').innerHTML='';

  const cb='_dl_'+Date.now();
  let s=null;
  const done=()=>{if(s?.parentNode)s.parentNode.removeChild(s);delete window[cb];};
  const t=setTimeout(()=>{done();showErr('Request timed out. Make sure you redeployed the script as a New Version with "Anyone" access.');},12000);

  window[cb]=d=>{
    clearTimeout(t);done();
    if(!Array.isArray(d)){showErr('Got unexpected data. Check your Apps Script code.');return;}
    all=d.filter(r=>name(r));  // skip rows with no variety name
    buildFilters();applyFilters();
    document.getElementById('controls').style.display='flex';
    document.getElementById('loading').style.display='none';
  };

  s=document.createElement('script');
  s.src=scriptUrl+(scriptUrl.includes('?')?'&':'?')+'callback='+cb;
  s.onerror=()=>{clearTimeout(t);done();showErr('Could not load script. Did you redeploy with the new Apps Script code and set access to "Anyone"?');};
  document.head.appendChild(s);
}

function showErr(msg){
  document.getElementById('loading').innerHTML=`<div style="font-size:2rem;margin-bottom:.8rem">⚠️</div>
    <p><strong>Could not connect.</strong></p>
    <p style="margin:.5rem auto;max-width:420px;font-size:.85rem;opacity:.8">${esc(msg)}</p>
    <button onclick="retry()" style="margin-top:1rem;padding:.45rem 1.2rem;background:#1c2e1c;color:#fff;border:none;border-radius:6px;cursor:pointer">Try Again</button>`;
}
function retry(){document.getElementById('loading').style.display='none';document.getElementById('setup').style.display='block';}

function uniq(arr){return[...new Set(arr.filter(Boolean))].sort();}

function buildFilters(){
  // Status: simplified categories
  const statuses=uniq(all.map(d=>{
    const s=status(d).toLowerCase();
    if(s.includes('culled')||s.includes('virus'))return 'Culled';
    if(s.includes('died'))return 'Died';
    if(s.includes('planted'))return 'Planted';
    if(s.includes('cutting'))return 'Cutting';
    if(s.includes('tuber'))return 'Tuber';
    return null;
  }));
  const locs=uniq(all.map(d=>loc(d)));
  const yrs=['2025','2026'].filter(y=>all.some(d=>gv(d,y).toLowerCase()==='yes'));

  mkPills('status-fg','Status:',statuses,aSt,d=>{
    const s=status(d).toLowerCase();
    if(s.includes('culled')||s.includes('virus'))return 'Culled';
    if(s.includes('died'))return 'Died';
    if(s.includes('planted'))return 'Planted';
    if(s.includes('cutting'))return 'Cutting';
    if(s.includes('tuber'))return 'Tuber';
    return '';
  });
  mkPills('loc-fg','Location:',locs,aLoc,d=>loc(d));
  mkPills('yr-fg','Year:',yrs,aYr,d=>'');  // handled separately
}

function mkPills(id,lbl,vals,set,getFn){
  const el=document.getElementById(id);
  if(!vals.length){el.innerHTML='';return;}
  el.innerHTML=`<span class="flbl">${lbl}</span>`;
  vals.forEach(v=>{
    const b=document.createElement('button');
    b.className='pill';b.textContent=v;
    b.onclick=()=>{set.has(v)?(set.delete(v),b.classList.remove('on')):(set.add(v),b.classList.add('on'));applyFilters();};
    el.appendChild(b);
  });
}

function toggleFavFilter(){favOnly=!favOnly;document.getElementById('favbtn').classList.toggle('fon',favOnly);applyFilters();}

function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const srt=document.getElementById('srt').value;

  let res=all.filter(d=>{
    const n=name(d).toLowerCase();
    const s=status(d).toLowerCase();
    let stCat='';
    if(s.includes('culled')||s.includes('virus'))stCat='Culled';
    else if(s.includes('died'))stCat='Died';
    else if(s.includes('planted'))stCat='Planted';
    else if(s.includes('cutting'))stCat='Cutting';
    else if(s.includes('tuber'))stCat='Tuber';

    if(q&&!n.includes(q)&&!obs(d).toLowerCase().includes(q))return false;
    if(aSt.size&&!aSt.has(stCat))return false;
    if(aLoc.size&&!aLoc.has(loc(d)))return false;
    if(aYr.size){
      const match=[...aYr].some(y=>gv(d,y).toLowerCase()==='yes');
      if(!match)return false;
    }
    if(favOnly&&!favs.has(name(d)))return false;
    return true;
  });

  res=[...res].sort((a,b)=>{
    if(srt==='name')return name(a).localeCompare(name(b));
    if(srt==='nz')return name(b).localeCompare(name(a));
    if(srt==='ha')return num(height(a))-num(height(b));
    if(srt==='hd')return num(height(b))-num(height(a));
    return 0;
  });

  render(res);
  document.getElementById('count').textContent=`Showing ${res.length} of ${all.length} dahlias`;
}

// Pastel gradient based on name (deterministic)
function cardBg(n){
  let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;
  return `hsl(${h},35%,88%)`;
}

function render(list){
  const g=document.getElementById('grid');
  if(!list.length){
    g.innerHTML='<div class="empty"><div style="font-size:2.5rem;margin-bottom:.8rem">🌿</div><p>No dahlias match your filters.</p></div>';
    return;
  }
  g.innerHTML=list.map(d=>{
    const oi=all.indexOf(d),n=name(d),st=status(d),h=height(d),l=loc(d),o=obs(d),img=photo(d),fv=favs.has(n);
    const sc=statusClass(st),bg=cardBg(n);
    const imgHtml=img?`<img class="cimg" src="${esc(img)}" alt="${esc(n)}" loading="lazy" onerror="this.style.display='none';this.previousSibling.style.display='flex'">`:'';
    return `<div class="card" onclick="openModal(${oi})">
      <button class="fbtn" onclick="event.stopPropagation();toggleFav(${oi},this)">${fv?'❤️':'🤍'}</button>
      <div class="cph" style="background:${bg};${img?'display:none':''}">🌸</div>
      ${imgHtml}
      <div class="cbody">
        <div class="cname">${esc(n)}</div>
        <div class="ctags">
          ${sc?`<span class="tag ${sc}">${esc(statusLabel(st))}</span>`:''}
          ${l?`<span class="tag tl">${esc(l)}</span>`:''}
          ${h?`<span class="tag ty">📏 ${esc(h)}</span>`:''}
        </div>
        ${o?`<div class="cobs">${esc(o)}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function toggleFav(i,btn){
  const n=name(all[i]);
  favs.has(n)?(favs.delete(n),btn.textContent='🤍'):(favs.add(n),btn.textContent='❤️');
  if(favOnly)applyFilters();
}

function openModal(i){
  const d=all[i];if(!d)return;
  const n=name(d),st=status(d),h=height(d),l=loc(d),o=obs(d),img=photo(d),
    f=future(d),fr=from(d),ps=photoStream(d),y25=yr25(d),y26=yr26(d),sc=statusClass(st),bg=cardBg(n);

  const rows=[[h&&'Height',h&&`📏 ${h}`],[l&&'Location',l],[y25&&'2025',y25],[y26&&'2026',y26],[ps&&'Photo Stream',ps],[fr&&'From',fr]].filter(r=>r[0]);

  document.getElementById('modal').innerHTML=`
    <button class="mclose" onclick="closeModal()">✕</button>
    ${img?`<img class="mimg" src="${esc(img)}" alt="${esc(n)}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:``}
    <div class="mph" style="${img?'display:none;':''}background:${bg}">🌸</div>
    <div class="mbody">
      <div class="mname">${esc(n)}</div>
      <div class="mtags">
        ${sc?`<span class="mtag ${sc}">${esc(statusLabel(st))}</span>`:''}
        ${l?`<span class="mtag tl">${esc(l)}</span>`:''}
      </div>
      ${rows.length?`<div class="mgrid">${rows.map(([k,v])=>`<div><div class="ml">${esc(k)}</div><div class="mv">${esc(v)}</div></div>`).join('')}</div>`:''}
      ${o?`<div class="msect">Observations</div><div class="mobs">${esc(o)}</div>`:''}
      ${f?`<div class="msect">Future Plantings</div><div class="mobs">${esc(f)}</div>`:''}
    </div>`;

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
